# Google Cloud Build -> Cloud Run continuous deployment for Chat_Safe x Urimai
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chat-safe-urimai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chat-safe-urimai:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chat-safe-urimai:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chat-safe-urimai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/chat-safe-urimai:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production,GEMINI_MODEL=gemini-2.5-flash'

images:
  - 'gcr.io/$PROJECT_ID/chat-safe-urimai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/chat-safe-urimai:latest'
